openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: AI-powered search operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ai/search:
    post:
      operationId: aiSearch
      tags: [ai]
      summary: Ask the portfolio assistant
      description: Answers a natural-language question about Nicola Rischia's portfolio using AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSearchRequest"
      responses:
        "200":
          description: AI-generated answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnswer"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AiSearchRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 300
      required:
        - query
    AiAnswer:
      type: object
      properties:
        answer:
          type: string
      required:
        - answer

